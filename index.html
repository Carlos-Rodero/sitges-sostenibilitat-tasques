<!doctype html>
<html lang="ca">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>WE ARE LEGEND · Pendents de sostenibilitat</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="assets/we-are-legend.png" />

  <link
    rel="apple-touch-icon"
    href="assets/we-are-legend.png" />

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="styles.css?v=4" />
</head>


<body>

  <main class="wrap">

    <!-- =========================
         HEADER
         ========================= -->

    <header class="top">

      <div class="brand-header">

        <img
          src="assets/we-are-legend.png"
          alt="WE ARE LEGEND · Sitges"
          class="brand-logo" />

        <div class="brand-copy">

          <p class="eyebrow">
            Festival de Sitges 2026
          </p>

          <h1>
            Pendents de sostenibilitat
          </h1>

          <p class="subtitle">
            Bloc compartit per apuntar tasques pendents i marcar-les quan estiguin resoltes.
          </p>

        </div>

      </div>


      <button
        id="newTaskBtn"
        class="primary">
        + Nova tasca
      </button>

    </header>


    <!-- =========================
         TOOLBAR
         ========================= -->

    <section class="toolbar">

      <div
        class="filters"
        id="responsibleFilters">

        <button
          class="filter active"
          data-resp="ALL">
          Tots
        </button>

      </div>


      <label class="toggle">

        <input
          id="hideDone"
          type="checkbox" />

        <span>
          Amaga les fetes
        </span>

      </label>

    </section>


    <!-- =========================
         RESPONSABLES
         ========================= -->

    <section
      class="legend"
      id="responsibleLegend">
    </section>


    <button
      id="manageResponsiblesBtn"
      class="manage-responsibles"
      type="button">
      Gestiona responsables
    </button>


    <!-- =========================
         TASK LIST
         ========================= -->

    <section
      class="task-list"
      id="taskList"
      aria-live="polite">
    </section>


    <p
      id="emptyState"
      class="empty"
      hidden>
      No hi ha tasques amb aquest filtre.
    </p>

  </main>


  <!-- =========================
       NEW / EDIT TASK DIALOG
       ========================= -->

  <dialog id="taskDialog">

    <form id="taskForm">

      <h2 id="dialogTitle">
        Nova tasca
      </h2>


      <label>

        Tasca

        <textarea
          id="taskText"
          rows="4"
          required
          placeholder="Ex. Consultar amb Mònica si hi ha pressupost..."></textarea>

      </label>


      <label>

        Responsable

        <select
          id="taskResp"
          required>
        </select>

      </label>


      <div class="dialog-actions">

        <button
          type="button"
          id="cancelBtn"
          class="ghost">
          Cancel·la
        </button>


        <button
          type="submit"
          id="saveTaskBtn"
          class="primary">
          Afegeix
        </button>

      </div>

    </form>

  </dialog>


  <!-- =========================
       RESPONSABLES DIALOG
       ========================= -->

  <dialog id="responsiblesDialog">

    <div class="responsibles-panel">


      <div class="responsibles-header">

        <h2>
          Gestiona responsables
        </h2>


        <button
          type="button"
          id="closeResponsiblesBtn"
          class="responsibles-close"
          aria-label="Tanca">
          ×
        </button>

      </div>


      <div
        id="responsiblesList"
        class="responsibles-list">
      </div>


      <hr />


      <h3>
        Nou responsable
      </h3>


      <div class="responsible-form">


        <label>

          Codi

          <input
            id="newResponsibleCode"
            type="text"
            maxlength="2"
            placeholder="Ex. AB"
            autocomplete="off" />

        </label>


        <label>

          Nom

          <input
            id="newResponsibleName"
            type="text"
            placeholder="Ex. Anna Bosch"
            autocomplete="off" />

        </label>


        <button
          type="button"
          id="addResponsibleBtn"
          class="primary">
          + Afegeix responsable
        </button>


      </div>

    </div>

  </dialog>


  <!-- =========================
       SCRIPTS
       ========================= -->

  <script src="config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

  <script src="app.js"></script>

</body>

</html>
